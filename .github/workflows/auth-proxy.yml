name: Auth Proxy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment (DEMO/LIVE)'
        required: true
        default: 'DEMO'
      duration:
        description: 'Run Duration (e.g., 1h, 30m, 6h)'
        required: true
        default: '6h'

jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Hono Proxy
        env:
          ENV: ${{ github.event.inputs.env }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_USER: ${{ secrets.CAPITAL_USER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          PORT: 3000
        run: |
          npm run start:proxy &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Start Tunnel
        run: |
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES: Starting Cloudflare Tunnel..."
            
            # Start tunnel in background
            cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
            TUNNEL_PID=$!
            
            # Wait up to 20 seconds for the URL to appear
            for i in {1..10}; do
              URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -n 1)
              if [ -n "$URL" ]; then
                echo "PROXY_URL=$URL" >> $GITHUB_ENV
                echo "::notice title=Proxy URL::$URL"
                echo "✅ Tunnel established: $URL"
                # Clean up tunnel.log for next time just in case, but we are done here
                exit 0
              fi
              
              # Check if the process actually died (e.g., 500 error)
              if ! kill -0 $TUNNEL_PID 2>/dev/null; then
                echo "❌ Tunnel process exited prematurely."
                break
              fi
              sleep 2
            done
            
            echo "⚠️ Tunnel attempt $RETRY_COUNT failed or timed out. Retrying in 5s..."
            kill $TUNNEL_PID 2>/dev/null || true
            sleep 5
          done
          
          echo "❌ Failed to establish tunnel after $MAX_RETRIES attempts."
          cat tunnel.log
          exit 1

      - name: Verify Capital.com Connectivity
        run: |
          echo "Testing proxy authentication with real credentials..."
          # We send an empty body to trigger the proxy's 'Smart Fallback' logic,
          # which injects the real CAPITAL_USER and CAPITAL_PASSWORD secrets.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/session \
            -H "Content-Type: application/json" \
            -d '{}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Full Authentication Verified: Proxy successfully logged into Capital.com"
          else
            echo "❌ Authentication Failed: Proxy received $HTTP_CODE from Capital.com. Check your GitHub Secrets."
            exit 1
          fi

      - name: Update Discovery State
        if: env.PROXY_URL != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if grep -q "proxy_url:" .planning/STATE.md; then
            sed -i "s|proxy_url:.*|proxy_url: $PROXY_URL|" .planning/STATE.md
          elif grep -q "\*\*Proxy URL\*\*:" .planning/STATE.md; then
            sed -i "s|\*\*Proxy URL\*\*:.*|\*\*Proxy URL\*\*: $PROXY_URL|" .planning/STATE.md
          else
            sed -i "/## Current Position/a **Proxy URL**: $PROXY_URL" .planning/STATE.md
          fi
          
          git add .planning/STATE.md
          git commit -m "chore(infra): update ephemeral proxy URL [skip ci]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Keep Alive
        run: |
          INPUT_DURATION="${{ github.event.inputs.duration }}"
          echo "Proxy is running at $PROXY_URL"
          
          # Parse duration (e.g., 1h, 30m, or 360)
          if [[ "$INPUT_DURATION" == *h ]]; then
            MINS=${INPUT_DURATION%h}
            TOTAL_MINS=$((MINS * 60))
          elif [[ "$INPUT_DURATION" == *m ]]; then
            TOTAL_MINS=${INPUT_DURATION%m}
          else
            TOTAL_MINS=$INPUT_DURATION
          fi
          
          echo "The proxy will remain active for $TOTAL_MINS minutes ($INPUT_DURATION)."
          
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + TOTAL_MINS * 60))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            if curl -s http://localhost:3000/ping > /dev/null; then
              REMAINING=$(( (END_TIME - $(date +%s)) / 60 ))
              echo "$(date): Proxy is still healthy... (Approx. $REMAINING min remaining)"
            else
              echo "$(date): Proxy health check failed! Exiting."
              exit 1
            fi
            sleep 60
          done
          echo "Specified duration of $INPUT_DURATION reached. Shutting down proxy."

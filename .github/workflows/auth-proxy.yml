name: Auth Proxy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment (DEMO/LIVE)'
        required: true
        default: 'DEMO'

jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Hono Proxy
        env:
          ENV: ${{ github.event.inputs.env }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_USER: ${{ secrets.CAPITAL_USER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          PORT: 3000
        run: |
          npm run start:proxy &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Start Tunnel
        run: |
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES: Starting Cloudflare Tunnel..."
            
            # Start tunnel in background
            cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
            TUNNEL_PID=$!
            
            # Wait up to 20 seconds for the URL to appear
            for i in {1..10}; do
              URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -n 1)
              if [ -n "$URL" ]; then
                echo "PROXY_URL=$URL" >> $GITHUB_ENV
                echo "::notice title=Proxy URL::$URL"
                echo "✅ Tunnel established: $URL"
                # Clean up tunnel.log for next time just in case, but we are done here
                exit 0
              fi
              
              # Check if the process actually died (e.g., 500 error)
              if ! kill -0 $TUNNEL_PID 2>/dev/null; then
                echo "❌ Tunnel process exited prematurely."
                break
              fi
              sleep 2
            done
            
            echo "⚠️ Tunnel attempt $RETRY_COUNT failed or timed out. Retrying in 5s..."
            kill $TUNNEL_PID 2>/dev/null || true
            sleep 5
          done
          
          echo "❌ Failed to establish tunnel after $MAX_RETRIES attempts."
          cat tunnel.log
          exit 1

      - name: Verify Capital.com Connectivity
        run: |
          echo "Testing proxy connectivity to Capital.com..."
          # We send a request to /session. Since we don't provide credentials here, 
          # the proxy will use GHA secrets (Credential Fallback).
          # We expect a 200 (success) or 400 (invalid credentials but connection OK).
          # A 5xx or connection error would indicate a failure.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/session \
            -H "Content-Type: application/json" \
            -d '{"identifier": "connectivity-test", "password": "connectivity-test"}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "✅ Connectivity Verified: Proxy can reach Capital.com"
          else
            echo "❌ Connectivity Failed: Proxy received $HTTP_CODE from Capital.com"
            exit 1
          fi

      - name: Update Discovery State
        if: env.PROXY_URL != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if grep -q "proxy_url:" .planning/STATE.md; then
            sed -i "s|proxy_url:.*|proxy_url: $PROXY_URL|" .planning/STATE.md
          elif grep -q "\*\*Proxy URL\*\*:" .planning/STATE.md; then
            sed -i "s|\*\*Proxy URL\*\*:.*|\*\*Proxy URL\*\*: $PROXY_URL|" .planning/STATE.md
          else
            sed -i "/## Current Position/a **Proxy URL**: $PROXY_URL" .planning/STATE.md
          fi
          
          git add .planning/STATE.md
          git commit -m "chore(infra): update ephemeral proxy URL [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Keep Alive
        run: |
          echo "Proxy is running at $PROXY_URL"
          echo "The proxy will remain active until the GitHub Action times out (max 6 hours)."
          while true; do
            if curl -s http://localhost:3000/ping > /dev/null; then
              echo "$(date): Proxy is still healthy..."
            else
              echo "$(date): Proxy health check failed! Exiting."
              exit 1
            fi
            sleep 60
          done

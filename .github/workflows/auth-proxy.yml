name: Auth Proxy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment (DEMO/LIVE)'
        required: true
        default: 'DEMO'
      duration:
        description: 'Run Duration (e.g., 1h, 30m, 6h)'
        required: true
        default: '2h'

jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install

      - name: Install cloudflared
        run: |
          # Use a specific version for stability and reliability
          VERSION="2026.5.2"
          wget -q https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

      - name: Start Hono Proxy
        env:
          ENV: ${{ github.event.inputs.env }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_USER: ${{ secrets.CAPITAL_USER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          PORT: 3000
        run: |
          npm run start:proxy &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Start Cloudflare Tunnel
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          RUNNER_TRACKING_ID: ""
        run: |
          echo "Extracting and preparing tunnel token..."
          # Extract only the token part (Base64 JSON objects start with 'ey')
          # Standard Base64 uses [A-Za-z0-9+/=]
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | grep -oE 'ey[A-Za-z0-9+/=]{100,}')
          
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "❌ Error: Could not find a valid Cloudflare token in the secret."
            echo "The token should be a long Base64 string starting with 'ey'."
            echo "If you pasted the full 'cloudflared tunnel run --token ...' command into the secret, please update the secret to contain ONLY the token part."
            exit 1
          fi
          
          echo "Starting Named Tunnel via TUNNEL_TOKEN env var..."
          # Set the environment variable for cloudflared to pick up
          export TUNNEL_TOKEN="$CLEAN_TOKEN"
          nohup cloudflared tunnel run > cloudflared.log 2>&1 &
          echo $! > tunnel.pid
          echo "Tunnel process started with PID $(cat tunnel.pid)"
          
          sleep 10
          if ! kill -0 $(cat tunnel.pid) 2>/dev/null; then
            echo "❌ Tunnel process died immediately. Check logs:"
            cat cloudflared.log
            exit 1
          fi

      - name: Verify Tunnel Reachability
        run: |
          echo "Waiting for tunnel propagation..."
          sleep 10
          
          CLIENT_ID="${{ secrets.CF_ACCESS_CLIENT_ID }}"
          CLIENT_SECRET="${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
          
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "❌ Error: CF_ACCESS_CLIENT_ID or CF_ACCESS_CLIENT_SECRET is missing from GitHub Secrets."
            echo "Please add them to Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          
          URL="${{ secrets.PROXY_STATIC_URL }}"
          URL="${URL%/}"
          echo "Testing connectivity to $URL/ping..."
          
          # Fetch and follow redirects, capturing final URL and status code
          curl -L -s -o /dev/null -w "%{url_effective}\n%{http_code}" \
            -H "CF-Access-Client-Id: $CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            "$URL/ping" > result.txt
          
          FINAL_URL=$(head -n 1 result.txt)
          RESPONSE=$(tail -n 1 result.txt)
          
          echo "Final Destination: $FINAL_URL"
          echo "Response Code: $RESPONSE"
          
          if [[ "$FINAL_URL" == *cloudflareaccess.com* ]]; then
            echo "❌ Error: Request was intercepted by Cloudflare Access login page."
            echo "This means your 'Service Auth' policy is not correctly configured in Cloudflare Zero Trust."
            echo "REQUIRED SETUP:"
            echo "1. Go to Cloudflare Zero Trust -> Access -> Applications."
            echo "2. Edit the application for your domain."
            echo "3. Add a Policy with Action: 'Service Auth'."
            echo "4. Include: 'Service Token' -> [Select your token name]."
            exit 1
          fi
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Tunnel is healthy and reachable at the edge."
          else
            echo "❌ Tunnel unreachable. HTTP Code: $RESPONSE."
            exit 1
          fi

      - name: Verify Capital.com Connectivity
        run: |
          echo "Testing proxy authentication with real credentials..."
          # Capture status code and body in one go to minimize requests
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl -s -w "%{http_code}" -X POST http://localhost:3000/session \
            -H "Content-Type: application/json" \
            -d '{}' -o "$RESPONSE_FILE")
          
          echo "Response Code: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ Full Authentication Verified: Proxy successfully logged into Capital.com"
            echo "Account Data Preview:"
            jq '.' "$RESPONSE_FILE" || cat "$RESPONSE_FILE"
          elif [ "$STATUS_CODE" -eq 429 ]; then
            echo "⚠️ Rate Limited: Capital.com returned 'too many requests'."
            echo "Infrastructure is WORKING perfectly, but we've logged in too many times during debugging."
            echo "Wait 5-10 minutes before running this workflow again."
            # We don't exit 1 here because the infrastructure is actually proven working by the 429
          else
            echo "❌ Authentication Failed: Proxy received $STATUS_CODE from Capital.com."
            cat "$RESPONSE_FILE"
            exit 1
          fi

      - name: Keep Alive
        run: |
          INPUT_DURATION="${{ github.event.inputs.duration }}"
          echo "Proxy is running at ${{ secrets.PROXY_STATIC_URL }}"
          if [[ "$INPUT_DURATION" == *h ]]; then
            MINS=${INPUT_DURATION%h}
            TOTAL_MINS=$((MINS * 60))
          elif [[ "$INPUT_DURATION" == *m ]]; then
            TOTAL_MINS=${INPUT_DURATION%m}
          else
            TOTAL_MINS=$INPUT_DURATION
          fi
          echo "The proxy will remain active for $TOTAL_MINS minutes ($INPUT_DURATION)."
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + TOTAL_MINS * 60))
          while [ $(date +%s) -lt $END_TIME ]; do
            if curl -s http://localhost:3000/ping > /dev/null; then
              REMAINING=$(( (END_TIME - $(date +%s)) / 60 ))
              echo "$(date): Proxy is still healthy... (Approx. $REMAINING min remaining)"
            else
              echo "$(date): Proxy health check failed! Exiting."
              exit 1
            fi
            sleep 60
          done
          echo "Specified duration of $INPUT_DURATION reached. Shutting down proxy."

      - name: Cleanup Tunnel
        if: always()
        run: |
          if [ -f tunnel.pid ]; then
            PID=$(cat tunnel.pid)
            echo "Stopping tunnel process $PID..."
            kill $PID || true
          fi

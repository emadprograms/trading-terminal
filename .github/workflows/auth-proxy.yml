name: Auth Proxy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment (DEMO/LIVE)'
        required: true
        default: 'DEMO'
      duration:
        description: 'Run Duration (e.g., 1h, 30m, 6h)'
        required: true
        default: '2h'

jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Hono Proxy
        env:
          ENV: ${{ github.event.inputs.env }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_USER: ${{ secrets.CAPITAL_USER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          PORT: 3000
        run: |
          npm run start:proxy &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Start Cloudflare Tunnel
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          echo "Starting Named Tunnel via token..."
          nohup cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }} > cloudflared.log 2>&1 &
          echo $! > tunnel.pid
          echo "Tunnel process started with PID $(cat tunnel.pid)"
          sleep 10
          if ! kill -0 $(cat tunnel.pid) 2>/dev/null; then
            echo "❌ Tunnel process died immediately. Check logs:"
            cat cloudflared.log
            exit 1
          fi

      - name: Verify Tunnel Reachability
        run: |
          echo "Testing connectivity to ${{ secrets.PROXY_STATIC_URL }}..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" 
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" 
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" 
            ${{ secrets.PROXY_STATIC_URL }}/ping)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Tunnel is healthy and reachable at the edge."
          else
            echo "❌ Tunnel unreachable. HTTP Code: $RESPONSE. Check Cloudflare Dashboard."
            cat cloudflared.log
            exit 1
          fi

      - name: Verify Capital.com Connectivity
        run: |
          echo "Testing proxy authentication with real credentials..."
          RESPONSE=$(curl -s -w "%{http_code}" -X POST http://localhost:3000/session 
            -H "Content-Type: application/json" 
            -d '{}')
          echo "Response Code: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Full Authentication Verified: Proxy successfully logged into Capital.com"
          else
            echo "❌ Authentication Failed: Proxy received $RESPONSE from Capital.com. Check your GitHub Secrets."
            exit 1
          fi

      - name: Keep Alive
        run: |
          INPUT_DURATION="${{ github.event.inputs.duration }}"
          echo "Proxy is running at ${{ secrets.PROXY_STATIC_URL }}"
          if [[ "$INPUT_DURATION" == *h ]]; then
            MINS=${INPUT_DURATION%h}
            TOTAL_MINS=$((MINS * 60))
          elif [[ "$INPUT_DURATION" == *m ]]; then
            TOTAL_MINS=${INPUT_DURATION%m}
          else
            TOTAL_MINS=$INPUT_DURATION
          fi
          echo "The proxy will remain active for $TOTAL_MINS minutes ($INPUT_DURATION)."
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + TOTAL_MINS * 60))
          while [ $(date +%s) -lt $END_TIME ]; do
            if curl -s http://localhost:3000/ping > /dev/null; then
              REMAINING=$(( (END_TIME - $(date +%s)) / 60 ))
              echo "$(date): Proxy is still healthy... (Approx. $REMAINING min remaining)"
            else
              echo "$(date): Proxy health check failed! Exiting."
              exit 1
            fi
            sleep 60
          done
          echo "Specified duration of $INPUT_DURATION reached. Shutting down proxy."

      - name: Cleanup Tunnel
        if: always()
        run: |
          if [ -f tunnel.pid ]; then
            PID=$(cat tunnel.pid)
            echo "Stopping tunnel process $PID..."
            kill $PID || true
          fi
